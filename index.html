<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>ManiBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="no-photos on-home">
<!-- #stage holds everything; it is rotated 90° when the TV is mounted in portrait -->
<div id="stage">

  <!-- Background photo slideshow (two layers that cross-fade) -->
  <div class="slideshow" aria-hidden="true">
    <div class="slide" id="slideA"><div class="slide-bg"></div><div class="slide-img"></div></div>
    <div class="slide" id="slideB"><div class="slide-bg"></div><div class="slide-img"></div></div>
    <div class="scrim"></div>
  </div>

  <main class="app" id="app">
    <div class="pages">

      <!-- ============ Page 1: Home ============ -->
      <section class="page page-home" data-page="home">
        <div class="left">
          <header class="hero">
            <div class="greeting" id="greeting">&nbsp;</div>
            <div class="clock"><span id="clockTime">--:--</span><span class="ampm" id="clockAmPm"></span></div>
            <div class="date" id="clockDate">&nbsp;</div>
            <div class="weather" id="weather" hidden></div>
          </header>

          <section class="panel next-meals">
            <div class="panel-head">
              <h2 class="panel-title">Next meals</h2>
              <span class="panel-sub" id="nextMealsSub"></span>
            </div>
            <div class="meal-tiles" id="nextMeals"></div>
          </section>
        </div>

        <aside class="right">
          <section class="panel cal-panel">
            <div class="panel-head">
              <h2 class="panel-title">Calendar</h2>
              <span class="panel-sub" id="calSub"></span>
            </div>
            <div class="scroll" id="calList"></div>
            <button class="add-btn focusable" data-action="add-event"><span data-icon="plus"></span>Add event</button>
          </section>

          <section class="panel todo-panel">
            <div class="panel-head">
              <h2 class="panel-title">To-do</h2>
              <span class="panel-sub" id="todoSub"></span>
            </div>
            <div class="scroll" id="todoList"></div>
            <button class="add-btn focusable" data-action="add-task"><span data-icon="plus"></span>Add task</button>
          </section>
        </aside>
      </section>

      <!-- ============ Page 2: Month calendar ============ -->
      <section class="page page-month" data-page="month" hidden>
        <section class="panel month-panel">
          <div class="page-head">
            <h2 class="page-title" id="monthTitle">&nbsp;</h2>
            <div class="head-actions">
              <button class="btn focusable" data-action="month-prev" aria-label="Previous month"><span data-icon="left"></span></button>
              <button class="btn focusable" data-action="month-today">Today</button>
              <button class="btn focusable" data-action="month-next" aria-label="Next month"><span data-icon="right"></span></button>
            </div>
            <div class="page-clock" data-clock></div>
          </div>
          <div class="dow-row" id="monthDow"></div>
          <div class="month-grid" id="monthGrid"></div>
        </section>
      </section>

      <!-- ============ Page 3: Meal planner + groceries ============ -->
      <section class="page page-meals" data-page="meals" hidden>
        <section class="panel meals-panel">
          <div class="page-head">
            <h2 class="page-title" id="weekTitle">&nbsp;</h2>
            <div class="head-actions">
              <button class="btn focusable" data-action="week-prev" aria-label="Previous week"><span data-icon="left"></span></button>
              <button class="btn focusable" data-action="week-today">This week</button>
              <button class="btn focusable" data-action="week-next" aria-label="Next week"><span data-icon="right"></span></button>
            </div>
            <div class="page-clock" data-clock></div>
          </div>
          <div class="meal-table" id="mealTable"></div>
        </section>

        <aside class="panel grocery-panel">
          <div class="panel-head">
            <h2 class="panel-title">Groceries</h2>
            <span class="panel-sub" id="grocerySub"></span>
          </div>
          <div class="scroll" id="groceryList"></div>
          <div class="grocery-actions">
            <button class="add-btn focusable" data-action="add-grocery"><span data-icon="plus"></span>Add item</button>
            <button class="add-btn focusable" data-action="clear-groceries"><span data-icon="check"></span>Clear ticked</button>
          </div>
        </aside>
      </section>
    </div>

    <!-- ============ Bottom bar: page selector + controls ============ -->
    <nav class="bottombar" aria-label="Pages and controls">
      <div class="tabs" role="tablist">
        <button class="tab focusable" data-action="page" data-page="home" aria-current="page"><span data-icon="home"></span><span class="lbl">Home</span></button>
        <button class="tab focusable" data-action="page" data-page="month"><span data-icon="calendar"></span><span class="lbl">Month</span></button>
        <button class="tab focusable" data-action="page" data-page="meals"><span data-icon="meal"></span><span class="lbl">Meals</span></button>
      </div>
      <div class="tools">
        <button class="tool focusable" data-action="photo-mode"><span data-icon="image"></span><span class="lbl">Photo mode</span></button>
        <button class="tool focusable" data-action="next-photo"><span data-icon="next"></span><span class="lbl">Next photo</span></button>
        <button class="tool focusable" data-action="settings"><span data-icon="sliders"></span><span class="lbl">Settings</span></button>
      </div>
      <span class="status" id="status"></span>
    </nav>
  </main>

  <div class="mini-clock" id="miniClock" aria-hidden="true"></div>
  <div class="night-dim" id="nightDim" aria-hidden="true"></div>
  <div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status"></div>
</div>

  <script src="config.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
